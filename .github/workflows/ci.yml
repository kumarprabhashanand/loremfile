# Pull-request gate (docs/09 §3.1).
#
# Deliberately not run on push to main: deploy.yml re-runs the same generate, validate
# and check steps on the merged commit, so a second run here would only duplicate compute.
#
# Every job runs inside the pinned toolchain image, referenced by the digest in
# tools/TOOLCHAIN_DIGEST. toolchain.yml rewrites the image line below when it publishes a
# new digest, so the two never drift.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # tools/TOOLCHAIN_DIGEST is the only place the digest lives (docs/09 §2). Jobs read it
  # here and refer to the output, so a digest bump touches one file and no workflow —
  # which is also why `propose-digest-bump` needs no `workflows: write`.
  # Verified before adopting: `container.image` does accept `needs.*.outputs.*` on
  # GitHub-hosted runners (spike run 34354550593 pulled and created the container).
  setup:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.read.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "digest=$(cat tools/TOOLCHAIN_DIGEST)" >> "$GITHUB_OUTPUT"

  lint-and-test:
    needs: setup
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.setup.outputs.digest }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge-base manifest and lock-file checks need real history.
          fetch-depth: 0

      - name: Install the package
        run: pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src/

      - name: Dependency lock is consistent
        # Fails if tools/requirements.in changed without the lock and the digest
        # changing too. Needs the full history fetched above.
        run: tools/check_lock.sh

      - name: Validate the catalog
        run: loremfile catalog validate

      - name: Unit tests
        run: pytest -q tests/unit

  build-and-validate:
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.setup.outputs.digest }}
    timeout-minutes: 45
    needs: [setup, lint-and-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `build --new` compares against the merge-base manifest.
          fetch-depth: 0

      - name: Install the package
        run: pip install -e . --no-deps

      # Which CPU built these bytes. Media fixtures differ between CPU models
      # (docs/06 §4); without this line the correlation cannot be made after the fact,
      # and the question "is it the hardware or the encoder?" stays open forever.
      - name: Record the CPU this runner has
        run: |
          grep -m1 '^model name' /proc/cpuinfo || true
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' \
            | grep -E '^(avx|avx2|avx512[a-z]*|sse4_2|fma)$' | sort | tr '\n' ' '
          echo

      - name: Fetch the base branch
        # actions/checkout does not create a remote-tracking ref for the pull request's
        # base branch, even at fetch-depth: 0, and `build --new` needs the merge base to
        # know which fixtures this pull request adds. GITHUB_BASE_REF is the target
        # branch, which is not always `main` when pull requests are stacked.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Generate the fixtures this pull request adds
        # On a pull request that touches no catalog entry this correctly generates
        # nothing, leaves an empty build/fixtures and a build/selection.json saying so,
        # and the steps below all have to survive that.
        run: loremfile build --new

      - name: Validate them
        run: loremfile validate

      # Before the integration tests: both catch a manifest that disagrees with the
      # regenerated bytes, but only this one prints the entries to commit, and a failure
      # is far more useful than the pair of truncated hashes pytest shows.
      - name: Manifest lock check
        run: |
          if loremfile manifest check > manifest-check.txt 2>&1; then
            cat manifest-check.txt
          else
            cat manifest-check.txt
            {
              echo '### Manifest disagrees with the bytes this runner produced'
              echo
              echo 'Encoder libraries dispatch on CPU features, so an author machine and'
              echo 'CI can differ (docs/06 §4). CI is the authority: commit these entries.'
              echo
              echo '```json'
              cat manifest-check.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Integration tests
        run: pytest -q tests/integration

      # docs/09 §3.1 also lists `loremfile site build` and `pytest tests/site` here.
      # Neither exists until M4.1, so they are added by that milestone rather than
      # standing here as a guaranteed red cross.

      - name: Fixture inventory
        # Deliberately *not* the fixture bytes. docs/09 §3.1 asks for a `new-fixtures`
        # artifact of build/fixtures; that directory is already 243 MB at M3.1 and would
        # be ~620 MB at launch, on every pull request, against a free-tier storage quota.
        # The hashes and sizes are what a reviewer actually reads, and they are 4 KB.
        # Revisit if the owner would rather pay for the bytes (see docs/19).
        run: |
          cd build/fixtures
          find . -type f -printf '%s\t%p\n' | sort -k2 > "$GITHUB_WORKSPACE/inventory.txt"
          find . -type f -print0 | sort -z | xargs -0 --no-run-if-empty sha256sum \
            >> "$GITHUB_WORKSPACE/inventory.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-inventory
          path: inventory.txt
          # 90 days, not 7: for the paths below this is the only record of which CPU
          # produced which bytes, and the correlation is worthless if it expires first.
          retention-days: 90

      # The carry-forward store. Fixtures marked `expected_drift` do not reproduce
      # byte for byte on different hardware (docs/06 §4), so the bytes the manifest
      # describes cannot be rebuilt on demand — they exist only here until the deploy
      # publishes them. Five paths, about 69 MB, rather than the whole 500 MB build
      # directory that docs/09 §3.1 originally asked for and M3.1 dropped.
      - name: Collect the fixtures that cannot be rebuilt
        id: drift
        run: |
          mkdir -p carry-forward
          python - <<'PY' > drift-paths.txt
          from loremfile.catalog import Catalog
          for f in Catalog.load().fixtures():
              if f.expected_drift:
                  print(f.path)
          PY
          copied=0
          while read -r path; do
            [ -f "build/fixtures/$path" ] || continue
            mkdir -p "carry-forward/$(dirname "$path")"
            cp "build/fixtures/$path" "carry-forward/$path"
            copied=$((copied + 1))
          done < drift-paths.txt
          echo "copied=$copied" >> "$GITHUB_OUTPUT"
          echo "carrying forward $copied fixture(s) that cannot be rebuilt"
          cp inventory.txt carry-forward/inventory.txt || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.drift.outputs.copied != '0'
        with:
          name: carry-forward-fixtures
          path: carry-forward
          retention-days: 90
