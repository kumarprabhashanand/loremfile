# Builds and publishes the pinned toolchain image (docs/06 §9, docs/09 §3.6).
#
# Every other workflow runs its jobs *inside* this image, referenced by the digest in
# tools/TOOLCHAIN_DIGEST. Because of that, this workflow must run at least once before
# ci.yml is enabled (M1.5) — otherwise there is no digest to reference.
name: toolchain

on:
  push:
    paths:
      - tools/Dockerfile
      - tools/apt-versions.txt
      - tools/requirements.lock
      - tools/smoke.sh
      - .github/workflows/toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/loremfile-toolchain

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tools/Dockerfile
          push: true
          # Tagged by commit SHA only. There is deliberately no `latest`: workflows
          # reference the image by digest, and a moving tag would be a mutable surface.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false

      - name: Smoke test the image that was just pushed
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Testing $REF"
          # Image-level checks: pinned apt versions, ffmpeg encoders, SQLite FTS5,
          # Python imports, the zstd round trip and the determinism environment.
          docker run --rm -v "$PWD/tools:/t:ro" "$REF" bash /t/smoke.sh
          # The image does not contain the loremfile package — the repository is mounted
          # at run time and installed with `pip install -e .`. Prove that still works.
          docker run --rm -v "$PWD:/work" -w /work "$REF" bash -lc '
            pip install --quiet --no-deps -e . && python -c "import loremfile; print(\"loremfile\", loremfile.__version__)"'

      - name: Record build provenance
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p provenance
          {
            echo "# Full package inventory of $REF"
            echo "# Informational only. tools/apt-versions.txt is the pinned *input*;"
            echo "# tools/smoke.sh asserts the installed versions match it."
            echo
          } > provenance/dpkg-list.txt
          docker run --rm "$REF" dpkg-query -W -f='${Package}=${Version}\n' \
            | sort >> provenance/dpkg-list.txt
          docker run --rm "$REF" pip freeze > provenance/pip-freeze.txt
          echo "$REF" > provenance/image-ref.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-provenance
          path: provenance/

      - name: Summary
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Toolchain image"
            echo
            echo '```'
            echo "$REF"
            echo '```'
            echo
            echo "Put that line in \`tools/TOOLCHAIN_DIGEST\` (one line, no trailing text)."
          } >> "$GITHUB_STEP_SUMMARY"

  # On main, propose the digest bump as a pull request so the change is reviewed and CI
  # can run the determinism tests against the new image. On any other branch the author
  # is already in a pull request, so the digest is copied in by hand from the summary.
  propose-digest-bump:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open a pull request if the digest changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -f tools/TOOLCHAIN_DIGEST ] && [ "$(cat tools/TOOLCHAIN_DIGEST)" = "$REF" ]; then
            echo "tools/TOOLCHAIN_DIGEST is already $REF — nothing to do."
            exit 0
          fi
          branch="toolchain/digest-${GITHUB_SHA::12}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          echo "$REF" > tools/TOOLCHAIN_DIGEST
          # Every workflow that runs jobs inside the image refers to it by digest.
          sed -i "s|image: ghcr.io/.*/loremfile-toolchain@sha256:[0-9a-f]\{64\}|image: $REF|g" \
            .github/workflows/*.yml
          # manifest.json records the image that generated the fixtures. The command
          # arrives in M1.6, so only run it once both exist.
          if [ -f manifest.json ] && command -v loremfile >/dev/null 2>&1; then
            loremfile manifest update
          fi
          git add -A
          git commit -m "toolchain: bump image digest to ${REF##*@}"
          git push origin "$branch"
          {
            echo "Automated by \`toolchain.yml\`. New image:"
            echo
            echo '```'
            echo "$REF"
            echo '```'
            echo
            echo "The smoke test passed against this exact digest before the pull"
            echo "request was opened. CI on this pull request runs the determinism"
            echo "tests against the new image."
          } > /tmp/pr-body.md
          gh pr create --base main --head "$branch" \
            --title "toolchain: bump image digest" \
            --body-file /tmp/pr-body.md
