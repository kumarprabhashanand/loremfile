# docs/09-ci-cd.md §4.
# Python updates change tools/requirements.in; the PR must also regenerate
# tools/requirements.lock (pip-compile --generate-hashes) and bump
# tools/TOOLCHAIN_DIGEST: tools/check_lock.sh in ci.yml fails otherwise.
version: 2
updates:
  - package-ecosystem: pip
    directory: /tools
    schedule: { interval: monthly }
    groups: { python-deps: { patterns: ["*"] } }
    # Any other pyarrow version changes published Parquet bytes (tools/requirements.in).
    # fpdf2 2.9 changes pdf/letter-1page.pdf (tools/requirements.in); 2.8 patches still flow.
    ignore:
      - dependency-name: "pyarrow"
      - dependency-name: "fpdf2"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /tools
    schedule: { interval: monthly }
    # The Python base image is part of the determinism contract (docs/06 §4, RISK-21):
    # moving it can change generated bytes. Only patch-level updates are proposed here.
    # A minor or major Python move is one deliberate pull request at a milestone
    # boundary, with a determinism audit, never routine automation. Dependabot closed
    # old PR #50 (3.12 -> 3.14) itself on 2026-09-14, when this rule took effect; 3.14 was
    # then taken deliberately, with an audit that rebuilt every fixture in the new image.
    # The rule stays for the same reason: 3.15 is another decision, not another update.
    # Syntax per GitHub's options reference.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
