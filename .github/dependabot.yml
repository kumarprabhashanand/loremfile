# docs/09-ci-cd.md §4.
# Python updates change tools/requirements.in; the PR must also regenerate
# tools/requirements.lock (pip-compile --generate-hashes) and bump
# tools/TOOLCHAIN_DIGEST — tools/check_lock.sh in ci.yml fails otherwise.
version: 2
updates:
  - package-ecosystem: pip
    directory: /tools
    schedule: { interval: weekly }
    groups: { python-deps: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /tools
    schedule: { interval: weekly }
    # The Python base image is part of the determinism contract (docs/06 §4, RISK-21):
    # moving it can change generated bytes. Only patch-level updates are proposed here.
    # A minor or major Python move is one deliberate pull request at a milestone
    # boundary, with a determinism audit — never routine automation. Dependabot closed
    # #50 (3.12 -> 3.14) itself on 2026-09-14, when this rule took effect; the move is
    # tracked in #1 as a milestone-boundary item. Syntax per GitHub's options reference.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
