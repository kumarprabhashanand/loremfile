# Word documents (docs/05 §3.5). Every phase-1 row; the phase-2 rows follow.
format: docx
family: documents
mime: application/vnd.openxmlformats-officedocument.wordprocessingml.document
description: >-
  Word documents for upload forms, converters and text extractors: plain paragraphs,
  embedded images and a data table. Written by python-docx and normalised so the bytes
  never move. No macros: a .docx cannot carry them, and none of these is a .docm.
seo_title: "Sample DOCX files for testing, free, CC0 and hotlinkable"
related: [pdf, rtf, xlsx]  # odt joins when M7 adds it
fixtures:
  - name: with-tracked-changes.docx
    phase: 2
    generator: office.docx_tracked_changes
    params: {}
    description: "One tracked deletion (cancelled), one insertion (confirmed) and one anchored comment. A naive XML text extractor returns deleted text as current; accepting the changes leaves the delivery status confirmed."
    tags: [document, text]
    expect: { insertions: 1, deletions: 1, comments: 1, deleted_text: cancelled, inserted_text: confirmed, tracking_enabled: true }
    size_class: free
    contains_text:
      - "Tracked changes"
      - "The delivery status is"
      - "Review the updated delivery status"
    label: "tracked changes"
  - name: with-table.docx
    phase: 1
    generator: office.docx_with_table
    params: { rows: 10 }
    description: "A ten-row table of the shared people dataset with a bold header row, in the Table Grid style."
    tags: [document, dataset-people]
    expect: { tables: 1, table_rows: 11, images: 0 }
    size_class: free
    contains_text:
      - "first_name"
      - "Bucharest"
      - "Gothenburg"
      - "Montreal"
    label: "table"
  - name: with-images.docx
    phase: 1
    generator: office.docx_with_images
    params: { images: ["png/100x100.png", "png/640x480.png"] }
    description: "Two published PNG fixtures embedded as pictures, read from the bytes that were actually published rather than regenerated."
    tags: [document, image]
    expect: { images: 2, tables: 0 }
    size_class: free
    contains_text:
      - "Amet nisi fuga et"
      - "Veritatis aliquip modi reprehenderit"
      - "Ex quis dicta esse"
      - "Architecto vitae sunt irure"
    depends_on: ["png/100x100.png", "png/640x480.png"]
    label: "2 images"
  - name: anchored-image-with-alt-text.docx
    phase: 2
    generator: office.docx_anchored_image
    params: { image: jpg/640x480.jpg }
    description: "One published JPEG anchored to a paragraph and floating right of the text, with alt text: for extractors and converters that only look for inline pictures."
    tags: [document, image]
    expect: { images: 1, inline_images: 0, anchored_images: 1, images_with_alt_text: 1 }
    size_class: free
    contains_text:
      - "Assumenda ad recusandae magna"
      - "Voluptate laudantium nesciunt rerum"
      - "Saepe voluptatem nulla proident"
      - "Possimus laboris tempor quia"
    depends_on: ["jpg/640x480.jpg"]
    label: "anchored image"
  - name: 1page.docx
    phase: 1
    generator: office.docx_basic
    params: { paragraphs: 3 }
    description: "One page: a heading and three paragraphs of Lorem Ipsum in the default Word styles. The page count is what Word renders it as; .docx stores no page count of its own."
    tags: [document, text]
    expect: { paragraphs: 4, tables: 0, images: 0 }
    size_class: free
    contains_text:
      - "Autem aute laborum eaque"
      - "Amet fuga veniam alias"
      - "Ea dolor aute cupidatat"
      - "Explicabo tempora qui sequitur"
    label: "plain text"
  - name: 1mb.docx
    phase: 1
    generator: office.docx_sized
    params: { size: 1000000 }
    description: "About 1MB: one Lorem Ipsum paragraph per embedded incompressible seeded-noise PNG, so the size is honest rather than padded."
    tags: [document, sized, image]
    expect: { tables: 0 }
    size_class: approx
    nominal_bytes: 1000000
    label: "1 MB"
  - name: 10mb.docx
    phase: 1
    generator: office.docx_sized
    params: { size: 10000000 }
    description: "About 10MB: one Lorem Ipsum paragraph per embedded incompressible seeded-noise PNG, so the size is honest rather than padded."
    tags: [document, sized, image, large]
    expect: { tables: 0 }
    size_class: approx
    nominal_bytes: 10000000
    label: "10 MB"
  - name: 10pages.docx
    phase: 1
    generator: office.docx_pages
    params: { pages: 10 }
    description: "Ten sections of Lorem Ipsum, each after the first set to start on a new page: nine forced page breaks, so ten pages at the least in any renderer. A .docx stores no page count of its own."
    tags: [document, multi-page, text]
    expect: { paragraphs: 40, page_breaks: 9, min_pages: 10, tables: 0, images: 0 }
    size_class: free
    contains_text:
      - "Quaerat ullamco deserunt magna"
      - "Quis eu vitae quis"
      - "Omnis sapiente enim voluptate"
      - "Proident sequi fugit inventore"
    label: "10 pages"
  - name: with-headers-footers.docx
    phase: 1
    generator: office.docx_headers_footers
    params: { pages: 3 }
    description: "Three pages with a header on each and a footer built from PAGE and NUMPAGES fields. Header and footer live in parts of their own, which extractors that read only the body never see."
    tags: [document, multi-page, text]
    expect: { paragraphs: 12, headers: 1, footers: 1, header_text: "loremfile.dev sample header", footer_text: "Page 1 of 3", footer_fields: [NUMPAGES, PAGE], page_breaks: 2, min_pages: 3 }
    size_class: free
    contains_text:
      - "Omnis aute quia maiores"
      - "Dolor consequat repellat facere"
      - "Alias ut magna commodo"
      - "Delectus earum adipiscing est"
    label: "headers and footers"
  - name: with-headings-and-toc.docx
    phase: 1
    generator: office.docx_toc
    params: { chapters: 3, sections: 2 }
    description: "Three chapters of two sections each in Heading 1 and 2, behind a table-of-contents field whose entries are cached, so readers that do not update fields still see them. Word updates the field on open."
    tags: [document, multi-page, text]
    expect: { headings: 9, toc_fields: 1, toc_entries: 9, update_fields_on_open: true, page_breaks: 3, min_pages: 4 }
    size_class: free
    contains_text:
      - "Qui ratione sapiente culpa"
      - "Autem proident saepe possimus"
      - "Delectus lorem aperiam laudantium"
      - "Lorem rerum laborum ipsum"
    label: "table of contents"
  - name: with-comments.docx
    phase: 1
    generator: office.docx_comments
    params: { comments: 3 }
    description: "Three comments from two authors, each anchored to the first sentence of a paragraph. For extractors that drop comments, and for tools that must keep each one attached to the words it is about."
    tags: [document, text]
    expect: { comments: 3, comment_authors: ["Second reviewer", "loremfile.dev"], tables: 0, images: 0 }
    size_class: free
    contains_text:
      - "Sunt occaecat eiusmod ab"
      - "Esse rem deserunt voluptates"
      - "Tenetur inventore sunt voluptatem"
      - "Elit duis sint repellendus"
    label: "comments"
  - name: unicode-multilingual.docx
    phase: 1
    generator: office.docx_multilingual
    params: { scripts: [greek, cyrillic, arabic, hebrew, devanagari, thai, hanzi, hiragana, hangul_jamo] }
    description: "Pseudo-text in Latin, Greek, Cyrillic, Arabic, Hebrew, Devanagari, Thai, Chinese, Japanese and Korean scripts, then emoji and combining marks. The Arabic and Hebrew paragraphs run right to left."
    tags: [document, text, unicode]
    expect: { scripts: [arabic, cyrillic, devanagari, greek, han, hangul, hebrew, hiragana, latin, thai], rtl_paragraphs: 2 }
    size_class: free
    contains_text:
      - "Aliqua necessitatibus facere aliqua"
      - "ΓΤΖ εμΟΧ ςδΣ"
      - "ръ жк Щуу"
      - "إحشعىآأظ نى ةةفإكد"
      - "佯二元兹僭乳击傍"
    label: "multilingual text"
