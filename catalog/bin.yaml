    expect: { pattern: shake256 }
    size_class: exact
    nominal_bytes: 10000
  - name: 100kb.bin
    phase: 1
    generator: binary.shake
    params: { size: 100000 }
    description: "Exactly 100,000 bytes of high-entropy SHAKE-256 output (decimal units). Incompressible, so transfer sizes are honest."
