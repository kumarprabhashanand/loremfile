# Raw byte fixtures (docs/05 §3.10).
#
# 23 rows: every phase-1 row in §3.10. `100mib.bin` is phase 2 and deliberately absent —
# at 104,857,600 bytes it exceeds REQ-23's 100,000,000-byte cap, and `--all` selects
# active fixtures regardless of phase, so carrying the row here would fail every full
# build. It returns only if Q-22 raises the cap, which is a month-6 decision.
format: bin
family: binary
mime: application/octet-stream
description: >-
  Raw byte blobs at exact sizes, for upload limits, range requests and checksum
  plumbing. High-entropy, all-zero, all-ones and incrementing patterns.
seo_title: "Sample binary files for testing uploads and size limits — free, CC0"
related: [txt]  # edge joins this list when M3.8 adds catalog/edge.yaml
fixtures:
  - name: 1-byte.bin
    phase: 1
    generator: binary.zeros
    params: { size: 1 }
    description: "A single NUL byte. The smallest non-empty file, for minimum-size and off-by-one checks."
    tags: [binary, boundary]
    expect: { pattern: zeros }
    size_class: exact
    nominal_bytes: 1
  - name: 1kb.bin
    phase: 1
    generator: binary.shake
    params: { size: 1000 }
    description: "Exactly 1,000 bytes of high-entropy SHAKE-256 output (decimal units). Incompressible, so transfer sizes are honest."
    tags: [binary, sized]
    expect: { pattern: shake256 }
    size_class: exact
    nominal_bytes: 1000
  - name: 10kb.bin
    phase: 1
    generator: binary.shake
    params: { size: 10000 }
    description: "Exactly 10,000 bytes of high-entropy SHAKE-256 output (decimal units). Incompressible, so transfer sizes are honest."
