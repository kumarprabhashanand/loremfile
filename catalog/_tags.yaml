  - document
  - image
  - video
  - audio
  - data
  - archive
  - font
  - text
  - binary
  - mail
  - calendar
  - geo
  - web
  # properties
  - multi-page
  - animated
  - transparent
  - sized
  - boundary
  - encoding
  - unicode
  - large
  - stress
  - encrypted
  # defects (edge fixtures)
  - invalid
  - truncated
  - mismatched
  # shared datasets
  - dataset-people
  - dataset-orders
  - dataset-products
  # codecs
  - codec-h264
  - codec-vp9
  - codec-aac
  - codec-opus
  - codec-mp3
