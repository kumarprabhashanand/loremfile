# Markdown fixtures (docs/05 §3.6).
format: md
family: text
mime: text/markdown
description: >-
  Markdown documents: a README-shaped file, one exercising every common element, and a
  long one whose contents links and footnotes all resolve.
seo_title: "Sample Markdown files for testing parsers, free and CC0"
related: [txt]
fixtures:
  - name: readme-style.md
    phase: 1
    generator: text.lorem_sized
    params: { size: 4096 }
    description: "A README-shaped Markdown document of exactly 4,096 bytes."
    tags: [text, document]
    expect: { line_ending: lf }
    size_class: exact
    contains_text:
      - "Necessitatibus assumenda non voluptatem"
      - "Proident reiciendis quae dolor"
      - "Mollit dolor adipiscing veniam"
      - "Ex nostrud tenetur exercitation"
    nominal_bytes: 4096
  - name: all-elements.md
    phase: 1
    generator: text.markdown_all_elements
    description: >-
      Markdown exercising every common element: headings, emphasis, ordered and nested
      lists, a table, fenced code blocks with languages, a blockquote, a link, an image,
      a footnote and a raw HTML block.
    tags: [text, document]
    expect: { line_ending: lf }
    size_class: free
    contains_text:
      - "Officiis ipsa amet repudiandae"
      - "hello from a fenced block"
      - "The footnote body, rendered at the end of the document"
      - "A raw HTML block, which Markdown passes through untouched"
  - name: long-with-toc-and-footnotes.md
    phase: 2
    generator: text.markdown_long
    params: { sections: 16, paragraphs: 3, footnotes: 6 }
    description: "A long document: a contents list linking all sixteen section headings by anchor, and six numbered footnotes, with every link and every reference resolving."
    tags: [text, document]
    expect: { line_ending: lf, headings: 18, anchor_links: 16, footnotes: 6 }
    size_class: free
    contains_text:
      - "Beatae adipisci quisquam voluptatem"
      - "Debitis consectetur labore incididunt"
      - "Consequat consectetur quae debitis"
      - "Ipsum aperiam placeat numquam"
