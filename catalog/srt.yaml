# SubRip subtitles (docs/05 §3.6). Launch-set rows only.
format: srt
family: text
mime: application/x-subrip
description: >-
  SubRip subtitles: numbered cues, comma-separated milliseconds and CRLF line endings.
  The format every player reads and the one where a stray blank line loses a cue.
seo_title: "Sample SRT subtitle files for testing players — free, CC0"
related: [vtt, txt]
fixtures:
  - name: 3-cues.srt
    phase: 1
    generator: web.srt
    params: { count: 3 }
    description: "Three consecutive cues of three seconds each, the smallest useful subtitle file."
    tags: [text, web]
    expect: { cues: 3 }
    size_class: free
