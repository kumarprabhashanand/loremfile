# png fixtures (docs/05 §3.2). Every phase-1 row; the phase-2 rows follow.
format: png
family: images
mime: image/png
description: >-
  PNG test cards at the sizes people actually need, plus transparency, greyscale
  and an animated APNG.
seo_title: "Sample PNG images for testing uploads and viewers, free and CC0"
related: [jpg, webp, avif, gif, svg]
fixtures:
  - name: transparent-256x256.png
    phase: 1
    generator: image.testcard
    params: { width: 256, height: 256, fmt: PNG, mode: RGBA }
    description: "A colour-bar test card with a border, centre cross and a label giving the dimensions and mode, with a horizontal alpha ramp so transparency is visible rather than uniform."
    tags: [image, transparent]
    expect: { width: 256, height: 256, mode: RGBA }
    size_class: free
    label: "transparent"
  - name: animated-apng-10frames-128x128.png
    phase: 1
    generator: image.animated
    params: { width: 128, height: 128, frames: 10, fmt: PNG, duration_ms: 100 }
    description: "An animated PNG of 10 frames at 100 ms, the colour bars rotating one step per frame so the animation is obviously running."
    tags: [image, animated]
    expect: { width: 128, height: 128, frames: 10, animated: true }
    size_class: free
    label: "animated APNG"
  - name: grayscale-512x512.png
    phase: 1
    generator: image.testcard
    params: { width: 512, height: 512, fmt: PNG, mode: L }
    description: "A colour-bar test card with a border, centre cross and a label giving the dimensions and mode, converted to 8-bit greyscale."
    tags: [image]
    expect: { width: 512, height: 512, mode: L }
    size_class: free
    label: "greyscale"
  - name: 1x1.png
    phase: 1
    generator: image.testcard
    params: { width: 1, height: 1, fmt: PNG }
    description: "A single white pixel: the smallest useful PNG."
    tags: [image]
    expect: { width: 1, height: 1, mode: RGB, animated: false }
    size_class: free
    label: "1x1 pixel"
  - name: 1920x1080.png
    phase: 1
    generator: image.testcard
    params: { width: 1920, height: 1080, fmt: PNG }
    description: "A colour-bar test card with a border, centre cross and a label giving the dimensions and mode. 1920x1080, RGB."
    tags: [image]
    expect: { width: 1920, height: 1080, mode: RGB, animated: false }
    size_class: free
    label: "1920x1080"
  - name: 640x480.png
    phase: 1
    generator: image.testcard
    params: { width: 640, height: 480, fmt: PNG }
    description: "A colour-bar test card with a border, centre cross and a label giving the dimensions and mode. 640x480, RGB."
    tags: [image]
    expect: { width: 640, height: 480, mode: RGB, animated: false }
    size_class: free
    label: "640x480"
  - name: 100x100.png
    phase: 1
    generator: image.testcard
    params: { width: 100, height: 100, fmt: PNG }
    description: "A colour-bar test card with a border, centre cross and a label giving the dimensions and mode. 100x100, RGB."
    tags: [image]
    expect: { width: 100, height: 100, mode: RGB, animated: false }
    size_class: free
    label: "100x100"
  - name: 1mb.png
    phase: 1
    generator: image.noise_sized
    params: { size: 1000000, fmt: PNG }
    description: "About 1 MB of seeded RGB noise. Incompressible, so the size is honest."
    tags: [image, sized]
    expect: { mode: RGB }
    size_class: approx
    nominal_bytes: 1000000
    label: "1 MB"
  - name: 3840x2160.png
    phase: 1
    generator: image.testcard
    params: { width: 3840, height: 2160, fmt: PNG }
    description: "A 4K UHD RGB test card with a border, centre cross and a label giving the dimensions and mode, for decoders, resizers and thumbnailers that meet a large frame."
    tags: [image, large]
    expect: { width: 3840, height: 2160, mode: RGB }
    size_class: free
    label: "3840x2160"
  - name: indexed-8bit-256x256.png
    phase: 1
    generator: image.testcard
    params: { width: 256, height: 256, fmt: PNG, mode: P }
    description: "An indexed-colour PNG: each 8-bit sample is an index into a palette of at most 64 colours, not a colour. For code that assumes every PNG is RGB or greyscale."
    tags: [image]
    expect: { width: 256, height: 256, mode: P, palette_entries: 64 }
    size_class: free
    label: "indexed colour"
  - name: 16bit-256x256.png
    phase: 1
    generator: image.testcard
    params: { width: 256, height: 256, fmt: PNG, mode: "I;16" }
    description: "A 16-bit greyscale PNG: a diagonal ramp across the whole 16-bit range, so a decoder that keeps only 8 bits of each sample shows bands where this file is smooth."
    tags: [image]
    expect: { width: 256, height: 256, mode: "I;16" }
    size_class: free
    label: "high bit depth"
  - name: interlaced-512x512.png
    phase: 1
    generator: image.png_interlaced
    params: { width: 512, height: 512 }
    description: "An Adam7 interlaced PNG: the same test card as the plain files, stored in seven passes so a browser can show a coarse picture before the rest arrives."
    tags: [image]
    expect: { width: 512, height: 512, mode: RGB, interlaced: true }
    size_class: free
    label: "interlaced"
  - name: 10mb.png
    phase: 1
    generator: image.noise_sized
    params: { size: 10000000, fmt: PNG }
    description: "About 10MB of seeded noise, which PNG compression cannot shrink, fitted to within 5% of the nominal size. For upload limits that need a real image of a known size."
    tags: [image, sized, large]
    expect: { mode: RGB }
    size_class: approx
    nominal_bytes: 10000000
    label: "10 MB"
