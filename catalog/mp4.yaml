# MP4 video (docs/05 §3.3). Every phase-1 row; the phase-2 rows follow.
format: mp4
family: video
mime: video/mp4
description: >-
  H.264 video with AAC audio in MP4, the format every player and upload form accepts.
  Synthetic test patterns and a 440 Hz tone. Faststart files put the moov atom ahead
  of the media; the non-faststart variant keeps it at the end to test playback delays.
seo_title: "Sample MP4 video files for testing, free, CC0 and hotlinkable"
related: [webm, mkv, mov, mp3]
fixtures:
  - name: 1080p-10s.mp4
    expected_drift: >-
      Not byte-reproducible off the CI reference fleet: libvpx/libopus/libx264 choos
      e SIMD kernels from the CPU features they find and no ffmpeg flag reache
      s that choice (docs/06 section 4, RISK-21).
    phase: 1
    generator: media_video.mp4
    params: { width: 1920, height: 1080, duration: 10 }
    description: "1920x1080 at 30 fps, ten seconds, H.264 plus AAC."
    tags: [video, codec-h264, codec-aac]
    expect: { width: 1920, height: 1080, vcodec: h264, acodec: aac }
    size_class: free
    label: "1080p"
  - name: 720p-5s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 1280, height: 720, duration: 5 }
    description: "1280x720 at 30 fps, five seconds, H.264 plus AAC. The default sample if you need just one."
    tags: [video, codec-h264, codec-aac]
    expect: { width: 1280, height: 720, vcodec: h264, acodec: aac, fps: 30.0 }
    size_class: free
    label: "720p"
  - name: no-audio-720p-5s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 1280, height: 720, duration: 5, audio: false }
    description: "1280x720 with no audio track at all, for code paths that assume every video has one."
    tags: [video, codec-h264]
    expect: { width: 1280, height: 720, audio_streams: 0, video_streams: 1 }
    size_class: free
    label: "no audio"
  - name: non-faststart-720p-5s.mp4
    phase: 2
    generator: media_video.mp4
    params: { width: 1280, height: 720, duration: 5, faststart: false }
    description: "1280x720 at 30 fps, five seconds, H.264 plus AAC. Unlike mp4/720p-5s.mp4, moov follows mdat at the file end, so sequential progressive playback waits for the whole file."
    tags: [video, codec-h264, codec-aac]
    expect: { width: 1280, height: 720, vcodec: h264, acodec: aac, fps: 30.0, video_streams: 1, audio_streams: 1, faststart: false, moov_at_end: true }
    size_class: free
    label: "moov at end"
  - name: vertical-1080x1920-5s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 1080, height: 1920, duration: 5 }
    description: "Portrait 1080x1920, the shape phones record and social apps expect. Five seconds."
    tags: [video, codec-h264]
    expect: { width: 1080, height: 1920, vcodec: h264 }
    size_class: free
    label: "vertical 1080x1920"
  - name: h264-baseline-720p-5s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 1280, height: 720, duration: 5, profile: baseline, level: "3.0" }
    description: "H.264 Baseline profile at level 3.0: the constrained profile old devices and some hardware decoders need."
    tags: [video, codec-h264, codec-aac]
    expect: { width: 1280, height: 720, vcodec: h264 }
    size_class: free
    label: "H.264 Baseline"
  - name: 360p-5s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 640, height: 360, duration: 5 }
    description: "640x360 at 30 fps, five seconds, H.264 plus AAC. The small one, for quick tests."
    tags: [video, codec-h264, codec-aac]
    expect: { width: 640, height: 360, vcodec: h264, acodec: aac, video_streams: 1, audio_streams: 1 }
    size_class: free
    label: "360p"
  - name: 1mb.mp4
    phase: 1
    generator: media_video.mp4_sized
    params: { size: 1000000, duration: 10 }
    description: "About 1MB: 1280x720 at 30 fps for ten seconds, two-pass at a flat bitrate so the size is met by the encoder rather than by padding."
    tags: [video, sized, codec-h264]
    expect: { width: 1280, height: 720, vcodec: h264 }
    size_class: approx
    nominal_bytes: 1000000
    label: "1 MB"
  - name: 10mb.mp4
    expected_drift: >-
      Not byte-reproducible off the CI reference fleet: libvpx/libopus/libx264 choos
      e SIMD kernels from the CPU features they find and no ffmpeg flag reache
      s that choice (docs/06 section 4, RISK-21).
    phase: 1
    generator: media_video.mp4_sized
    params: { size: 10000000, duration: 60 }
    description: "About 10MB: 1280x720 at 30 fps for sixty seconds, two-pass at a flat bitrate."
    tags: [video, sized, codec-h264, large]
    expect: { width: 1280, height: 720, vcodec: h264 }
    size_class: approx
    nominal_bytes: 10000000
    label: "10 MB"
  - name: 50mb.mp4
    expected_drift: >-
      Not byte-reproducible off the CI reference fleet: libvpx/libopus/libx264 choos
      e SIMD kernels from the CPU features they find and no ffmpeg flag reache
      s that choice (docs/06 section 4, RISK-21).
    phase: 1
    generator: media_video.mp4_sized
    params: { size: 50000000, duration: 120 }
    description: "About 50MB: 1280x720 at 30 fps for two minutes, two-pass at a flat bitrate. The largest video in the launch set."
    tags: [video, sized, codec-h264, large]
    expect: { width: 1280, height: 720, vcodec: h264 }
    size_class: approx
    nominal_bytes: 50000000
    label: "50 MB"
  - name: 720p-30s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 1280, height: 720, duration: 30 }
    description: "1280x720 at 30 fps, thirty seconds, H.264 plus AAC. Long enough for seeking, buffering and progress-bar tests that a five-second clip cannot exercise."
    tags: [video, codec-h264, codec-aac]
    expect: { width: 1280, height: 720, vcodec: h264, acodec: aac, fps: 30.0 }
    size_class: free
    label: "30 seconds"
  - name: 1080p-60s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 1920, height: 1080, duration: 60 }
    description: "1920x1080 at 30 fps, sixty seconds, H.264 plus AAC: a full minute of Full HD for upload limits, transcode timing and streaming tests."
    tags: [video, codec-h264, codec-aac, large]
    expect: { width: 1920, height: 1080, vcodec: h264, acodec: aac, fps: 30.0 }
    size_class: free
    label: "60 seconds"
  - name: 4k-5s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 3840, height: 2160, duration: 5 }
    description: "3840x2160 at 30 fps, five seconds, H.264 plus AAC: the Ultra HD frame size, for decoders, thumbnailers and upload limits that choke on large frames."
    tags: [video, codec-h264, codec-aac]
    expect: { width: 3840, height: 2160, vcodec: h264, acodec: aac, fps: 30.0 }
    size_class: free
    label: "3840x2160"
  - name: square-720x720-5s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 720, height: 720, duration: 5 }
    description: "720x720 at 30 fps, five seconds, H.264 plus AAC. A square frame, the shape social feeds use, for players and croppers that assume landscape."
    tags: [video, codec-h264, codec-aac]
    expect: { width: 720, height: 720, vcodec: h264, acodec: aac, fps: 30.0 }
    size_class: free
    label: "square 720x720"
  - name: 60fps-720p-5s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 1280, height: 720, duration: 5, fps: 60 }
    description: "1280x720 at 60 fps, five seconds, H.264 plus AAC: twice the frame rate of the default sample, for players, frame-rate converters and timestamp code that assume 30."
    tags: [video, codec-h264, codec-aac]
    expect: { width: 1280, height: 720, vcodec: h264, acodec: aac, fps: 60.0 }
    size_class: free
    label: "60 fps"
  - name: rotated-90-metadata-720p-5s.mp4
    phase: 1
    generator: media_video.mp4
    params: { width: 1280, height: 720, duration: 5, rotation: 90 }
    description: "The picture of mp4/720p-5s.mp4, still stored 1280x720, with a display matrix that tells the player to turn it 90 degrees clockwise, so it should play as portrait 720x1280. A player that ignores the matrix shows it sideways."
    tags: [video, codec-h264, codec-aac]
    expect: { width: 1280, height: 720, vcodec: h264, acodec: aac, rotation: 90 }
    size_class: free
    label: "rotated 90 degrees"
