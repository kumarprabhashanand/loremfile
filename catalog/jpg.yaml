# jpg fixtures (docs/05 §3.2). Every phase-1 row; the phase-2 rows follow.
format: jpg
family: images
mime: image/jpeg
description: >-
  JPEG test cards including a progressive scan, a CMYK colour space and an EXIF
  orientation case that only displays correctly if the tag is honoured.
seo_title: "Sample JPEG images for testing uploads and viewers, free and CC0"
related: [png, webp, avif, tiff]
fixtures:
  - name: cmyk-640x640.jpg
    phase: 2
    generator: image.testcard
    params: { width: 640, height: 640, fmt: JPEG, mode: CMYK }
    description: "A CMYK JPEG, the colour space that trips pipelines expecting RGB. Replaces jpg/cmyk-640x480.jpg, whose name misstated its size."
    tags: [image]
    expect: { mode: CMYK, width: 640, height: 640 }
    size_class: free
    label: "CMYK"
  - name: progressive-1920x1080.jpg
    phase: 1
    generator: image.testcard
    params: { width: 1920, height: 1080, fmt: JPEG, quality: 85, progressive: true }
    description: "A colour-bar test card with a border, centre cross and a label giving the dimensions and mode, saved as a progressive JPEG rather than baseline."
    tags: [image]
    expect: { width: 1920, height: 1080, progressive: true }
    size_class: free
    label: "progressive"
  - name: exif-orientation-6-640x480.jpg
    phase: 1
    generator: image.exif_orientation
    params: { width: 640, height: 480, orientation: 6 }
    description: "Pixels stored rotated with EXIF orientation 6. The label reads upright only when the viewer honours the tag, so a viewer that ignores EXIF shows it sideways."
    tags: [image]
    expect: { exif_orientation: 6 }
    size_class: free
    label: "EXIF orientation 6"
  - name: exif-orientation-8-640x480.jpg
    phase: 1
    generator: image.exif_rotated
    params: { width: 640, height: 480 }
    description: "EXIF orientation 8: stored pixels are 480x640 and rotated clockwise. Honouring the tag displays the UP label upright at 640x480; ignoring it shows the image sideways."
    tags: [image]
    expect: { exif_orientation: 8, width: 480, height: 640, display_width: 640, display_height: 480, mode: RGB }
    size_class: free
    label: "EXIF orientation 8"
  - name: 4000x3000.jpg
    phase: 1
    generator: image.testcard
    params: { width: 4000, height: 3000, fmt: JPEG, quality: 85 }
    description: "A colour-bar test card with a border, centre cross and a label giving the dimensions and mode. 4000x3000, quality 85, 4:2:0 chroma subsampling."
    tags: [image]
    expect: { width: 4000, height: 3000, mode: RGB }
    size_class: free
    label: "4000x3000"
  - name: 1920x1080.jpg
    phase: 1
    generator: image.testcard
    params: { width: 1920, height: 1080, fmt: JPEG, quality: 85 }
    description: "A colour-bar test card with a border, centre cross and a label giving the dimensions and mode. 1920x1080, quality 85, 4:2:0 chroma subsampling."
    tags: [image]
    expect: { width: 1920, height: 1080, mode: RGB }
    size_class: free
    label: "1920x1080"
  - name: 640x480.jpg
    phase: 1
    generator: image.testcard
    params: { width: 640, height: 480, fmt: JPEG, quality: 85 }
    description: "A colour-bar test card with a border, centre cross and a label giving the dimensions and mode. 640x480, quality 85, 4:2:0 chroma subsampling."
    tags: [image]
    expect: { width: 640, height: 480, mode: RGB }
    size_class: free
    label: "640x480"
  - name: 100x100.jpg
    phase: 1
    generator: image.testcard
    params: { width: 100, height: 100, fmt: JPEG, quality: 85 }
    description: "A colour-bar test card with a border, centre cross and a label giving the dimensions and mode. 100x100, quality 85, 4:2:0 chroma subsampling."
    tags: [image]
    expect: { width: 100, height: 100, mode: RGB }
    size_class: free
    label: "100x100"
  - name: 1mb.jpg
    phase: 1
    generator: image.noise_sized
    params: { size: 1000000, fmt: JPEG, quality: 95 }
    description: "About 1MB of seeded noise at quality 95, 4:4:4. Noise does not compress, so the size is honest."
    tags: [image, sized]
    expect: { mode: RGB }
    size_class: approx
    nominal_bytes: 1000000
    label: "1 MB"
  - name: 10mb.jpg
    phase: 1
    generator: image.noise_sized
    params: { size: 10000000, fmt: JPEG, quality: 95 }
    description: "About 10MB of seeded noise at quality 95, 4:4:4. Noise does not compress, so the size is honest."
    tags: [image, sized]
    expect: { mode: RGB }
    size_class: approx
    nominal_bytes: 10000000
    label: "10 MB"
  - name: cmyk-640x480.jpg
    phase: 1
    generator: image.testcard
    params: { width: 640, height: 640, fmt: JPEG, mode: CMYK }
    description: "A CMYK JPEG, the colour space that trips pipelines expecting RGB. Its name says 640x480, but it measures 640x640; jpg/cmyk-640x640.jpg replaces it, and this URL keeps serving the same bytes."
    tags: [image]
    expect: { mode: CMYK }
    size_class: free
    superseded_by: jpg/cmyk-640x640.jpg
  - name: grayscale-640x480.jpg
    phase: 1
    generator: image.testcard
    params: { width: 640, height: 480, fmt: JPEG, mode: L, quality: 85 }
    description: "A single-component greyscale JPEG test card: one channel where an RGB file carries three. For code that assumes every JPEG is colour."
    tags: [image]
    expect: { width: 640, height: 480, mode: L }
    size_class: free
    label: "greyscale"
  - name: quality-10-640x480.jpg
    phase: 1
    generator: image.testcard
    params: { width: 640, height: 480, fmt: JPEG, quality: 10 }
    description: "The 640x480 colour-bar test card at JPEG quality 10: blocking and ringing around every edge, in a file about half the size of the quality-85 card. For checking what a pipeline does to a badly compressed upload."
    tags: [image]
    expect: { width: 640, height: 480, mode: RGB }
    size_class: free
    label: "heavy compression"
  - name: exif-orientation-1-640x480.jpg
    phase: 1
    generator: image.exif_orientation
    params: { width: 640, height: 480, orientation: 1 }
    description: "EXIF orientation 1: the pixels are stored upright and the tag says so, which a viewer has to leave alone. The control for the files whose tag asks for a rotation."
    tags: [image]
    expect: { width: 640, height: 480, exif_orientation: 1 }
    size_class: free
    label: "EXIF orientation 1"
  - name: exif-orientation-3-640x480.jpg
    phase: 1
    generator: image.exif_orientation
    params: { width: 640, height: 480, orientation: 3 }
    description: "EXIF orientation 3: the pixels are stored rotated half a turn, and a viewer that honours the tag turns the 640x480 card upright where one that ignores it leaves it upside down."
    tags: [image]
    expect: { width: 640, height: 480, exif_orientation: 3 }
    size_class: free
    label: "EXIF orientation 3"
  - name: exif-gps-640x480.jpg
    phase: 1
    generator: image.exif_gps
    params: { width: 640, height: 480 }
    description: "A 640x480 test card with an EXIF GPS position of 0 N 0 E, Null Island, where nobody lives, so no real location, and a capture time of 2020-01-01. For pipelines that read or strip location metadata."
    tags: [image]
    expect: { width: 640, height: 480, gps_latitude: 0.0, gps_longitude: 0.0, exif_datetime_original: "2020:01:01 00:00:00" }
    size_class: free
    label: "EXIF GPS location"
