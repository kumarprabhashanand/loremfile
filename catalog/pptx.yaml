# PowerPoint presentations (docs/05 §3.5). Every phase-1 row; the phase-2 rows follow.
format: pptx
family: documents
mime: application/vnd.openxmlformats-officedocument.presentationml.presentation
description: >-
  PowerPoint presentations for converters, thumbnailers and upload forms. Widescreen
  16:9, title-and-content slides of Lorem Ipsum. The 4:3 shape has its own fixture
  rather than being a silent default.
seo_title: "Sample PPTX files for testing, free, CC0 and hotlinkable"
related: [docx, pdf]  # odp joins when M7 adds it
fixtures:
  - name: with-chart.pptx
    phase: 1
    generator: office.pptx_basic
    params: { slides: 1, chart: true }
    description: "A title-and-content slide and a slide with a native column chart, its numbers kept in the workbook PowerPoint embeds beside it. For converters that render charts or read their data."
    tags: [document]
    expect: { slides: 2, charts: 1, tables: 0 }
    size_class: free
    label: "chart"
  - name: with-table.pptx
    phase: 1
    generator: office.pptx_basic
    params: { slides: 1, table_rows: 5 }
    description: "A title-and-content slide and a slide with a native table of five people from the shared dataset under a header row: a table, not a picture of one, for extractors that only read text frames."
    tags: [document, text]
    expect: { slides: 2, tables: 1, charts: 0 }
    size_class: free
    label: "table"
  - name: with-hidden-slide.pptx
    phase: 1
    generator: office.pptx_basic
    params: { slides: 3, hidden: [2] }
    description: "Three slides of Lorem Ipsum with the second marked hidden. A slideshow skips it; a converter that renders every slide shows it, and a counter that ignores the flag says three."
    tags: [document, multi-page, text]
    expect: { slides: 3, hidden_slides: 1 }
    size_class: free
    label: "hidden slide"
  - name: aspect-4-3-5slides.pptx
    phase: 1
    generator: office.pptx_basic
    params: { slides: 5, aspect: "4:3" }
    description: "Five title-and-content slides of Lorem Ipsum at 4:3, the slide size PowerPoint used before 2013, where every other deck here is 16:9."
    tags: [document, multi-page, text]
    expect: { slides: 5, slide_width_emu: 9144000, slide_height_emu: 6858000 }
    size_class: free
    label: "4:3 slides"
  - name: 10slides.pptx
    phase: 1
    generator: office.pptx_basic
    params: { slides: 10 }
    description: "Ten 16:9 title-and-content slides of Lorem Ipsum, each with its own title."
    tags: [document, multi-page, text]
    expect: { slides: 10, images: 0, slide_width_emu: 12191695, slide_height_emu: 6858000 }
    size_class: free
    contains_text:
      - "Perferendis mollit non fugiat"
      - "Ipsum fuga adipisci voluptate"
      - "Esse incidunt numquam totam"
      - "Aut id eiusmod dolor"
    label: "10 slides"
  - name: 1mb.pptx
    phase: 1
    generator: office.pptx_sized
    params: { size: 1000000 }
    description: "About 1MB: one slide per embedded incompressible seeded-noise PNG, each with a speaker note, so the size is honest rather than padded."
    tags: [document, sized, image]
    expect: { slide_width_emu: 12191695 }
    size_class: approx
    nominal_bytes: 1000000
    label: "speaker notes"
  - name: 1slide.pptx
    phase: 1
    generator: office.pptx_basic
    params: { slides: 1 }
    description: "A single 16:9 title-and-content slide of Lorem Ipsum."
    tags: [document, text]
    expect: { slides: 1, images: 0, slide_width_emu: 12191695, slide_height_emu: 6858000 }
    size_class: free
    contains_text:
      - "Proident culpa et aliqua"
      - "Proident quia occaecat magna"
      - "Itaque quasi alias fugit"
      - "Sequi nemo irure assumenda"
    label: "1 slide"
  - name: 10mb.pptx
    phase: 1
    generator: office.pptx_sized
    params: { size: 10000000 }
    description: "About 10MB: one slide per embedded incompressible seeded-noise PNG, each with a speaker note, so the size is honest rather than padded."
    tags: [document, sized, image, large]
    expect: { slide_width_emu: 12191695 }
    size_class: approx
    nominal_bytes: 10000000
    label: "10 MB"
  - name: with-images.pptx
    phase: 1
    generator: office.pptx_basic
    params: { slides: 1, images: ["png/100x100.png", "png/640x480.png"] }
    description: "A title-and-content slide, then two slides each holding a published PNG fixture as a picture, read from the bytes that were actually published rather than regenerated."
    tags: [document, image, multi-page]
    expect: { slides: 3, images: 2, tables: 0, charts: 0 }
    size_class: free
    contains_text:
      - "Doloribus asperiores repellendus architecto"
      - "Dolore sunt porro reprehenderit"
      - "Laborum doloribus anim in"
      - "Placeat fugit aliquip veniam"
    depends_on: ["png/100x100.png", "png/640x480.png"]
    label: "2 images"
  - name: with-notes.pptx
    phase: 1
    generator: office.pptx_basic
    params: { slides: 3, notes: true }
    description: "Three title-and-content slides of Lorem Ipsum, each with a speaker note. Notes live in parts of their own, which extractors that read only the slides never see."
    tags: [document, multi-page, text]
    expect: { slides: 3, notes: 3 }
    size_class: free
    contains_text:
      - "Omnis consectetur asperiores ipsa"
      - "Ipsa rem recusandae labore"
      - "Aspernatur asperiores fugiat accusantium"
      - "Ex esse necessitatibus accusantium"
    label: "notes on 3 slides"
  - name: with-table-and-chart.pptx
    phase: 1
    generator: office.pptx_basic
    params: { slides: 1, table_rows: 5, chart: true }
    description: "A title-and-content slide, a slide with a native table of five people and a slide with a native column chart: both of the shapes extractors tend to miss, in one deck."
    tags: [document, text]
    expect: { slides: 3, tables: 1, charts: 1 }
    size_class: free
    contains_text:
      - "Dolorum ullamco anim adipisci"
      - "Doloribus explicabo eaque ullamco"
      - "Quisquam placeat necessitatibus do"
      - "Laboris quibusdam asperiores dolor"
    label: "table and chart"
