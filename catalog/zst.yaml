# Single-stream zstd compression (docs/05 §3.8). Launch-set rows only.
format: zst
family: archives
mime: application/zstd
description: >-
  A single zstd stream, the shape `zstd` produces when it compresses one file rather
  than an archive. No container, no entry list: one payload in, one stream out.
seo_title: "Sample ZSTD files for testing decompression — free, CC0"
related: [tar, zip]
fixtures:
  - name: lorem-1mb.txt.zst
    phase: 1
    generator: archive.compressed_text
    params: { size: 1000000, kind: zst }
    description: "Exactly 1,000,000 bytes of Lorem Ipsum compressed as a single zstd stream, so the compression ratio is that of ordinary text."
    tags: [archive, text]
    expect: { compression: zst, uncompressed_bytes: 1000000 }
    size_class: free
