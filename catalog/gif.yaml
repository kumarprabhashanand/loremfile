# gif fixtures (docs/05 §3.2). Every phase-1 row; the phase-2 rows follow.
format: gif
family: images
mime: image/gif
description: >-
  A minimal GIF, a still frame, one with transparency and an animated one.
seo_title: "Sample GIF images for testing, free and CC0"
related: [png, webp]
fixtures:
  - name: 1x1.gif
    phase: 1
    generator: image.testcard
    params: { width: 1, height: 1, fmt: GIF }
    description: "A single-pixel GIF: the smallest useful image of this format."
    tags: [image]
    expect: { width: 1, height: 1, animated: false }
    size_class: free
  - name: animated-10frames-256x256.gif
    phase: 1
    generator: image.animated
    params: { width: 256, height: 256, frames: 10, fmt: GIF, duration_ms: 100 }
    description: "An animated GIF of 10 frames at 100 ms, looping forever."
    tags: [image, animated]
    expect: { width: 256, height: 256, frames: 10, animated: true }
    size_class: free
  - name: static-256x256.gif
    phase: 1
    generator: image.testcard
    params: { width: 256, height: 256, fmt: GIF }
    description: "A 256x256 colour-bar test card as a single-frame GIF: the still counterpart of the animated file."
    tags: [image]
    expect: { width: 256, height: 256, frames: 1, animated: false }
    size_class: free
  - name: transparent-256x256.gif
    phase: 1
    generator: image.gif_transparent
    params: { width: 256, height: 256 }
    description: "A 256x256 GIF whose right half is transparent. GIF marks one palette index transparent, so transparency is on or off, with none of the partial alpha the PNG ramp has."
    tags: [image, transparent]
    expect: { width: 256, height: 256, mode: P, transparent_pixels: 32768, frames: 1 }
    size_class: free
