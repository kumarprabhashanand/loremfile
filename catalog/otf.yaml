# The generated font family (docs/05 §3.9, ADR-018). Launch-set rows only.
format: otf
family: fonts
mime: font/otf
description: >-
  "Loremfile Sans" as OpenType with CFF outlines. Every glyph is a rectangle computed from its codepoint, so
  the family is generated rather than derived from any typeface, and text set in it
  renders as visible blocks.
seo_title: "Sample OTF font for testing renderers and loaders — free, CC0"
related: [ttf, woff, woff2]
fixtures:
  - name: loremfile-sans.otf
    phase: 1
    generator: font.family
    params: { cff: true }
    description: "The Loremfile Sans family as OpenType with CFF outlines: 95 printable ASCII glyphs drawn as rectangles of varying width, with fixed head timestamps and an unrestricted embedding permission."
    tags: [font]
    expect: { glyphs: 96, cmap_entries: 95, units_per_em: 1000, family: "Loremfile Sans" }
    size_class: free
