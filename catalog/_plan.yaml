# The phase-1 plan: every row docs/05 §3 specifies as phase 1, in §3's order, 416 in all.
#
# Written by reading §3 section by section, not parsed from it. §5's family totals and
# tests/unit/test_plan.py hold it. Not a catalog file: the loader skips names that begin
# with an underscore, and a row here says what was planned, not what exists.
#
# What the file is not: a row added after the plan with phase 1 in its own catalog file
# (the 1.9.0 to 1.11.0 variants, `csv/people-10-quoted-commas`, the two polyglots) is not
# here; the test names each one with its reason (docs/05 §5, "The plan index").
# "What is left to build" is this list minus catalog/*.yaml, never §5 minus the manifest.
#
# Two kinds of row were restored from the 1.1.0 text of §3 after a later rewrite dropped
# their (P1): `tiff/lzw-640x480` and `tiff/multipage-3pages` (1.9.0), `mkv/multi-audio-2-
# tracks-720p-5s` and `mkv/with-subtitles-720p-5s` (1.10.0), `parquet/people-1000-gzip` and
# `parquet/nested-types` (1.10.0). §3 was corrected in the same change.
