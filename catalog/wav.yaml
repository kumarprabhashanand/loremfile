# WAV audio (docs/05 §3.4). Launch-set rows only; the rest are P1b.
format: wav
family: audio
mime: audio/wav
description: >-
  Uncompressed PCM in WAV: 16-bit files behind the canonical 44-byte header, and a 24-bit
  file behind the 68-byte extensible one. The sized file is exact to the byte, because
  uncompressed audio is the one format where a byte count is arithmetic rather than an
  estimate.
seo_title: "Sample WAV audio files for testing, free, CC0 and hotlinkable"
related: [mp3, flac, aiff]
fixtures:
  - name: sine-440hz-3s-48k-24bit-stereo.wav
    phase: 2
    generator: media_audio.pcm
    params: { duration: 3, sample_rate: 48000, bits: 24, channels: 2 }
    description: "Three seconds of a sine tone as 48 kHz, 24-bit stereo PCM behind a 68-byte extensible header, the layout 24-bit writers produce; a reader that skips 44 bytes plays header as audio."
    tags: [audio]
    expect: { acodec: pcm_s24le, sample_rate: 48000, channels: 2, bit_depth: 24, header_format: extensible, header_bytes: 68 }
    size_class: free
    label: "24-bit 48 kHz"
  - name: sine-440hz-3s-44k-16bit-stereo.wav
    phase: 1
    generator: media_audio.pcm
    params: { duration: 3, sample_rate: 44100, bits: 16, channels: 2 }
    description: "A 440 Hz sine wave: three seconds of 44.1 kHz, 16-bit, stereo PCM: CD format, and what most software assumes a WAV is."
    tags: [audio]
    expect: { sample_rate: 44100, channels: 2, duration_ms: 3000 }
    size_class: free
    label: "16-bit 44.1 kHz"
  - name: 10mb.wav
    phase: 1
    generator: media_audio.wav_sized
    params: { size: 10000000, sample_rate: 44100, bits: 16, channels: 2 }
    description: "Exactly 10,000,000 bytes: a 44-byte header plus 2,499,989 frames of 44.1 kHz 16-bit stereo sine. Not approximately: exactly."
    tags: [audio, sized, large]
    expect: { sample_rate: 44100, channels: 2 }
    size_class: exact
    nominal_bytes: 10000000
    label: "exactly 10 MB"
