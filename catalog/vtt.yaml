# WebVTT subtitles (docs/05 §3.6). Launch-set rows only.
format: vtt
family: text
mime: text/vtt
description: >-
  WebVTT: the subtitle format browsers read natively, with dotted milliseconds, an
  optional STYLE block and regions that simpler parsers skip over.
seo_title: "Sample WebVTT subtitle files for testing browsers — free, CC0"
related: [srt, html]
fixtures:
  - name: 3-cues.vtt
    phase: 1
    generator: web.vtt
    params: { count: 3 }
    description: "The WEBVTT signature and three plain cues: what a track element needs and nothing more."
    tags: [text, web]
    expect: { cues: 3, has_style: false, has_region: false }
    size_class: free
