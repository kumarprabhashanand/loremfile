{
  "scope": {
    "formats": [
      "zip",
      "tar",
      "gz",
      "wav",
      "jpg",
      "png",
      "gif",
      "json",
      "csv",
      "xml",
      "pem",
      "der"
    ],
    "max_bytes": 16000000,
    "timeout_seconds": 30,
    "properties": {
      "zip": [
        "entries",
        "directories",
        "uncompressed_bytes"
      ],
      "tar": [
        "entries",
        "directories",
        "uncompressed_bytes"
      ],
      "gz": [
        "uncompressed_bytes",
        "members"
      ],
      "wav": [
        "channels",
        "sample_rate",
        "bit_depth",
        "duration_ms"
      ],
      "jpg": [
        "width",
        "height",
        "frames"
      ],
      "png": [
        "width",
        "height",
        "frames"
      ],
      "gif": [
        "width",
        "height",
        "frames"
      ],
      "json": [
        "top_type",
        "items"
      ],
      "csv": [
        "rows",
        "columns"
      ],
      "xml": [
        "root_element"
      ],
      "pem": [
        "subject_cn",
        "issuer_cn",
        "serial",
        "dns_names"
      ],
      "der": [
        "subject_cn",
        "issuer_cn",
        "serial",
        "dns_names"
      ]
    },
    "tolerance": {
      "duration_ms": 1
    },
    "exceptions": [
      {
        "name": "Duration",
        "applies": [
          "python/wave"
        ],
        "text": "A reported duration_ms within 1 ms of the manifest's is equal. This is the only tolerance anywhere."
      },
      {
        "name": "CSV header",
        "applies": [
          "go/encoding/csv",
          "python/csv"
        ],
        "text": "rows is compared with the manifest's rows plus one when has_header is true: the header is a record to a reader and not a data row."
      },
      {
        "name": "Clark notation",
        "applies": [
          "python/xml.etree.ElementTree"
        ],
        "text": "A root name in Clark notation, {namespace}local, is reduced to its local name before it is reported as root_element, the form the manifest and the other readers use. The namespace is reported as its own property, root_namespace, which is not compared."
      },
      {
        "name": "Name strings",
        "applies": [
          "node/crypto.X509Certificate",
          "ruby/OpenSSL::X509::Certificate"
        ],
        "text": "A certificate reader that gives names as text is reduced by the adapter to the values the manifest holds: the CN from a subject or issuer written CN=..., the DNS entries from subject alternative names written DNS:a, DNS:b, and, where the serial is given as hexadecimal text, the integer it spells."
      }
    ],
    "no_reader_when": [
      {
        "runtime": "go",
        "format": "tar",
        "when": {
          "compression": [
            "xz"
          ]
        }
      },
      {
        "runtime": "ruby",
        "format": "tar",
        "when": {
          "compression": [
            "xz"
          ]
        }
      }
    ],
    "routing": [
      {
        "format": "tar",
        "applies": [
          "go/archive/tar",
          "go/archive/tar+compress/gzip",
          "python/tarfile",
          "ruby/Gem::Package::TarReader",
          "ruby/Gem::Package::TarReader+Zlib::GzipReader"
        ],
        "text": "The manifest's compression decides what each tar reader is given. python/tarfile is given the file as it is, gzip and xz included, and decompresses it itself. archive/tar (Go) and Gem::Package::TarReader (Ruby) do not decompress, so each is given only uncompressed tar, compress/gzip or Zlib::GzipReader is chained into it for gzip-compressed tar (the arrangement Go's documentation describes) under its own reader id, and for xz-compressed tar neither Go nor Ruby has a reader: Go's standard library has bzip2, flate, gzip, lzw and zlib, and no xz."
      }
    ]
  },
